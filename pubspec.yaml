name: hiplab
description: "开胯训练助手 HipLab — offline hip mobility, flexibility and control training."
publish_to: 'none'
version: 1.1.2+68

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino localizations for Chinese and English UI.
  flutter_localizations:
    sdk: flutter
  # On-device state (lib/core/storage/local_state_storage.dart).
  shared_preferences: 2.5.6
  # Persistent installation ID for the AI relay's X-Device-Id header.
  uuid: 4.6.0
  # Drill clip player (lib/core/media/media_view_native.dart).
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.2
  # Native audio API also used by the retained output regression fixtures.
  just_audio: 0.10.6
  audio_session: 0.2.4
  # Session clock that widget tests can fake (package:clock).
  clock: ^1.1.2
  # Screen keep-alive is owned by ugk_trainer; retained here for plugin tests.
  wakelock_plus: 1.8.1
  # AI 定制 usage log location (lib/hip/coach/usage_file_io.dart); already
  # in the lock through shared_preferences, pinned to that version.
  path_provider: 2.1.6
  http: ^1.6.0
  purchases_flutter: 10.4.1
  url_launcher: 6.3.2
  # AI 训练助理 SDK (docs/ai-coach.md): catalog, TrainingPlan v1 validation,
  # prompts, OpenAI-compatible client, usage records, fallback.
  ugk_coach:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 7cd1c4392dc4114729f8f4301d3df2848524e6a3
  ugk_trainer_runtime:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 7cd1c4392dc4114729f8f4301d3df2848524e6a3
      path: packages/ugk_trainer_runtime
  ugk_coach_ui:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 7cd1c4392dc4114729f8f4301d3df2848524e6a3
      path: packages/ugk_coach_ui
  ugk_coach_chat:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 7cd1c4392dc4114729f8f4301d3df2848524e6a3
      path: packages/ugk_coach_chat

# Keep SDK transitive dependencies on the same reviewed commit.
dependency_overrides:
  ugk_coach:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 7cd1c4392dc4114729f8f4301d3df2848524e6a3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hip/
    - assets/hip/posters/
    - assets/hip/assessment/
    - assets/hip/assessment/light/
    - assets/hip/onboarding/pregnancy-friendly.webp
    - assets/hip/onboarding/surgery-friendly.webp
    - assets/hip/onboarding/acute-friendly.webp
    # SDK public metadata and transparent frame-zero posters; no bundled video.
    - assets/public_media/
    - assets/public_media/catalog/
    - assets/public_posters/
    - assets/public_posters/r2-v11/cover/
    - assets/public_posters/r2-v11/thumbnail/
    - assets/voice/
    - assets/voice/zh/
    - assets/voice/en/
    - assets/voice/chime/
    - assets/action_kits/
    - assets/licenses/
    - assets/coach/
    - assets/coach/ai-tags/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
