name: hiplab
description: "开胯训练助手 HipLab — offline hip mobility, flexibility and control training."
publish_to: 'none'
version: 0.3.8+14

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino localizations for the zh locale (date pickers, a11y labels).
  flutter_localizations:
    sdk: flutter
  # On-device state (lib/core/storage/local_state_storage.dart).
  shared_preferences: 2.5.6
  # Drill clip player (lib/core/media/media_view_native.dart).
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.2
  # Native audio API also used by the retained output regression fixtures.
  just_audio: 0.10.6
  audio_session: 0.2.4
  # Session clock that widget tests can fake (package:clock).
  clock: ^1.1.2
  # Screen keep-alive is owned by ugk_trainer; retained here for plugin tests.
  wakelock_plus: 1.8.1
  # AI 定制 usage log location (lib/hip/coach/usage_file_io.dart); already
  # in the lock through shared_preferences, pinned to that version.
  path_provider: 2.1.6
  # AI 训练助理 SDK (docs/ai-coach.md): catalog, TrainingPlan v1 validation,
  # prompts, OpenAI-compatible client, usage records, fallback.
  ugk_coach:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 7348f0cdcccf564fbddb73fef41c08e3bf30f0fa
  ugk_trainer:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 7348f0cdcccf564fbddb73fef41c08e3bf30f0fa
      path: packages/ugk_trainer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/hip/
    - assets/hip/posters/
    - assets/hip/assessment/
    - assets/hip/assessment/light/
    - assets/hip/onboarding/
    # Light-theme twins (tools/media/build_themed_media.py).
    - assets/drill_media/light/
    - assets/voice/
    - assets/voice/zh/
    - assets/voice/en/
    - assets/voice/chime/
    - assets/drill_media/
    - assets/action_kits/
    - assets/licenses/
    - assets/coach/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
