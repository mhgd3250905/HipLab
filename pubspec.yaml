name: hiplab
description: "开胯训练助手 HipLab — offline hip mobility, flexibility and control training."
publish_to: 'none'
version: 0.3.6+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino localizations for the zh locale (date pickers, a11y labels).
  flutter_localizations:
    sdk: flutter
  # On-device state (lib/core/storage/local_state_storage.dart).
  shared_preferences: 2.5.6
  # Drill clip player (lib/core/media/media_view_native.dart).
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.2
  # Voice coaching (lib/hip/voice/): pre-recorded clips, ducking, background.
  just_audio: 0.10.6
  audio_session: 0.2.4
  # Session clock that widget tests can fake (package:clock).
  clock: ^1.1.2
  # Keeps the screen on during a session so auto-lock never suspends the
  # training clock / voice (Android has no foreground service yet).
  wakelock_plus: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hip/
    - assets/hip/posters/
    - assets/hip/assessment/
    - assets/hip/onboarding/
    - assets/voice/
    - assets/voice/zh/
    - assets/voice/en/
    - assets/voice/chime/
    - assets/drill_media/
    - assets/action_kits/
    - assets/licenses/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
